<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e1915" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Einkauf">
<title>Einkauf</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><img src="icon.svg" alt=""><span>Einkauf</span></div>
    <nav id="nav">
      <button data-view="dash"><i>◧</i><span>Übersicht</span></button>
      <button data-view="list"><i>☰</i><span>Liste</span></button>
      <button data-view="offers"><i>%</i><span>Angebote</span></button>
      <button data-view="stores"><i>⌂</i><span>Läden</span></button>
      <button data-view="people"><i>☺</i><span>Personen</span></button>
      <button data-view="settings"><i>⚙</i><span>Mehr</span></button>
    </nav>
  </aside>

  <main id="main">
    <section id="view-dash" class="view"></section>
    <section id="view-list" class="view"></section>
    <section id="view-offers" class="view"></section>
    <section id="view-stores" class="view"></section>
    <section id="view-people" class="view"></section>
    <section id="view-settings" class="view"></section>
  </main>
</div>

<input id="photo-input" type="file" accept="image/*" hidden>
<input id="import-input" type="file" accept="application/json" hidden>

<dialog id="dlg"><form method="dialog" id="dlg-form"></form></dialog>
<dialog id="photo-dialog" class="photo"><img id="photo-big" alt=""><form method="dialog"><button class="btn">Schließen</button></form></dialog>
<div id="toast" role="status"></div>

<script src="categories.js"></script>
<script src="stores.js"></script>
<script src="sync-config.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
